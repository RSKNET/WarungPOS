name: Auto Release APK

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caller Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Private Actions Repo
        uses: actions/checkout@v4
        with:
          repository: RSKNET/Github-Actions
          token: ${{ secrets.GH_PAT }}
          path: .github/actions/github-actions

      - name: Run Auto Release APK Action
        uses: ./.github/actions/github-actions/Auto Release APK
        with:
          app_name: 'WarungPOS'
          node_version: '22'
          java_version: '21'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
